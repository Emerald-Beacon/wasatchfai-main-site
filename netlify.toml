# Netlify configuration for Wasatch FAI Website
# Static HTML site - no build required

[build]
  publish = "."

# ---------------------------------------------------------------------------
# CUTOVER COMPLETE -- 2026-08-03
#
# wasatchfai.com is now served by Netlify from this repo. The Wix site it
# replaced is gone, and the site is live to the public.
#
# The site-wide X-Robots-Tag: noindex that guarded the pre-launch staging
# subdomain HAS BEEN REMOVED. It was deliberately fail-closed, so it followed
# the cutover onto the production domain and was suppressing indexing of the
# real site until it was taken out here.
#
# Do NOT reintroduce a global noindex. If a future staging environment needs
# one, note that Netlify does not support context-specific headers in
# netlify.toml -- [context.production.headers] and friends parse without error
# and are silently ignored (headers and redirects here are global; only build
# settings and environment variables are context-aware). Use Netlify's
# per-site "Prevent search engine indexing" setting on the staging site
# instead, so the guard cannot ride along to production.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# REDIRECTS
# ---------------------------------------------------------------------------

# publish = "." ships the whole repo, which was serving docs/templates/*.html
# (developer scaffolding still full of {{PLACEHOLDER}} tokens) and
# docs/superpowers/**  (internal design specs) at HTTP 200. Nothing links to
# them and they are not in the sitemap, but they were publicly reachable, and
# the location template even registered a junk "{{FORM_NAME}}" form with
# Netlify Forms. Serve 404 instead; the files stay in the repo for developers.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404

# Preserve the old (misspelled) live-site URL for inbound links & SEO.
[[redirects]]
  from = "/ankle-franctures"
  to = "/ankle-fractures"
  status = 301

# Ogden consolidation. ogden.html and ogden-utah-foot-doctor.html both targeted
# Ogden podiatry intent; ogden.html was orphaned and its own schema sameAs
# pointed at the other page. The city page is now ogden-utah.html (serving
# Ogden) and the clinic page remains ogden-utah-foot-doctor.html (the South
# Ogden address). ogden.html is retired.
[[redirects]]
  from = "/ogden.html"
  to = "/ogden-utah"
  status = 301

[[redirects]]
  from = "/ogden"
  to = "/ogden-utah"
  status = 301

# NOTE: there is no /locations rule any more. It used to send /locations to
# /locations.html; now that the site is extensionless the page IS /locations,
# and the rewrite briefly turned this into /locations -> /locations, an
# infinite redirect. Do not re-add it.

# Short aliases for the city pages, so inbound links, print, and Google
# Business Profile references can use the bare city name.
[[redirects]]
  from = "/kaysville"
  to = "/kaysville-utah"
  status = 301
[[redirects]]
  from = "/fruit-heights"
  to = "/fruit-heights-utah"
  status = 301
[[redirects]]
  from = "/centerville"
  to = "/centerville-utah"
  status = 301
[[redirects]]
  from = "/bountiful"
  to = "/bountiful-utah"
  status = 301
[[redirects]]
  from = "/woods-cross"
  to = "/woods-cross-utah"
  status = 301
[[redirects]]
  from = "/layton"
  to = "/layton-utah"
  status = 301
[[redirects]]
  from = "/clearfield"
  to = "/clearfield-utah"
  status = 301
[[redirects]]
  from = "/roy"
  to = "/roy-utah"
  status = 301
[[redirects]]
  from = "/riverdale"
  to = "/riverdale-utah"
  status = 301
[[redirects]]
  from = "/north-ogden"
  to = "/north-ogden-utah"
  status = 301
[[redirects]]
  from = "/farmington"
  to = "/farmington-utah"
  status = 301
[[redirects]]
  from = "/south-ogden"
  to = "/ogden-utah-foot-doctor"
  status = 301

# The bulk .html -> extensionless retirements and the remaining legacy Wix URLs
# live in the generated `_redirects` file (see build-extensionless.py). Rules in
# this file are evaluated before those.
#
# Wix URL parity was checked against the Wayback CDX index for wasatchfai.com:
# of 167 archived Wix-era content paths, 155 already exist here and the rest are
# either covered by rules above, Wix internals, or image-parameter fragments
# (/post/al_c, /post/q_85) that were never pages.
